name: Sync News RSS Feeds

on:
  schedule:
    # Runs every 1 hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

concurrency:
  group: sync-news-feeds
  cancel-in-progress: false # Prevent overlapping sync jobs

jobs:
  sync-feeds:
    name: Sync RSS Feeds (The Hindu & Bhaskar English)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger News Ingestion via API
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret is not set in GitHub repository secrets."
            echo "Please navigate to Settings > Secrets and variables > Actions, and add APP_URL (e.g. https://your-site.vercel.app)."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set in GitHub repository secrets."
            echo "Please navigate to Settings > Secrets and variables > Actions, and add CRON_SECRET matching your production app environment."
            exit 1
          fi

          CLEAN_APP_URL="${APP_URL%/}"
          ENDPOINT="$CLEAN_APP_URL/api/news/sync"

          echo "Triggering RSS sync at: $ENDPOINT (hourly schedule)"

          HTTP_RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}" -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --connect-timeout 30 \
            --max-time 180)

          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP Response Status: $HTTP_STATUS"
          echo "Response Body:"
          echo "$BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Sync endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "RSS news feeds synced successfully!"
